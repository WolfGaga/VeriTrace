name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: VERITRACE/pyproject.toml
      - run: python -m pip install -e '.[documents,dev,ui,browser]'
        working-directory: VERITRACE
      - run: python -m pytest
        working-directory: VERITRACE
      - run: python -m ruff check veritrace tests
        working-directory: VERITRACE
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VERITRACE/frontend/React
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: VERITRACE/frontend/React/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
